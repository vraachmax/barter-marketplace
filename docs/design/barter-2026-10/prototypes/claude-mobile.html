<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бартер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width app column, stacked full-screen views, floating tab bar with a raised center button.
   Color: orange accent on neutral cool grays. Type: Onest throughout, heavy weights for titles and prices. */
:root{
  --bg:#ffffff; --fg:#101013; --muted:#8b8b98; --card:#ffffff; --chip:#f1f1f5; --line:#ececf1;
  --accent:#ff5a0a; --accent2:#ff7a1f; --blue:#e3ebfd; --lav:#e9edfc; --field:#f3f3f6; --section:#f4f4f7;
  --green:#1d9b4b; --greenbg:#e4f5ea; --shadow:0 4px 20px rgba(24,24,48,.07); --tabshadow:0 -8px 28px rgba(24,24,48,.07);
  --bubble:#f1f1f5; --ring:#ffffff; --star:#ff8a00;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --fg:#f6f6f8; --muted:#9a9aa6; --card:#1a1a1d; --chip:#1e1e22; --line:#2a2a2f;
  --blue:#233553; --lav:#222a44; --field:#1c1c20; --section:#17171a; --greenbg:#12301d; --green:#3ccf6e;
  --shadow:0 4px 20px rgba(0,0,0,.35); --tabshadow:0 -8px 28px rgba(0,0,0,.45); --bubble:#1e1e22; --ring:#0e0e10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --fg:#f6f6f8; --muted:#9a9aa6; --card:#1a1a1d; --chip:#1e1e22; --line:#2a2a2f;
  --blue:#233553; --lav:#222a44; --field:#1c1c20; --section:#17171a; --greenbg:#12301d; --green:#3ccf6e;
  --shadow:0 4px 20px rgba(0,0,0,.35); --tabshadow:0 -8px 28px rgba(0,0,0,.45); --bubble:#1e1e22; --ring:#0e0e10; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow:hidden;animation:in .22s ease}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gl);padding-right:var(--gr);padding-top:8px;padding-bottom:120px;overscroll-behavior:contain}
.sc.noscroll{overflow:hidden;padding-bottom:12px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.bleed{margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr))}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.muted{color:var(--muted)}
.o{color:var(--accent)}
.row{display:flex;align-items:center}
/* header */
.head{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{height:34px;width:auto;display:block}
.logo .word{height:19px;width:calc(19px*5.71);background:var(--fg);-webkit-mask:var(--wm) center/contain no-repeat;mask:var(--wm) center/contain no-repeat}
.sq{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;background:var(--chip);padding:0 14px 0 16px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14.5px}
.search input::placeholder{color:var(--muted)}
.search .sep{width:1px;height:22px;background:var(--line)}
.search button{color:var(--fg);display:grid;place-items:center;padding-left:2px}
.seg{display:flex;gap:4px;margin-top:9px}
.seg button,.pill{flex:1;height:36px;border-radius:18px;background:var(--chip);font-size:15px;font-weight:500;color:var(--fg);transition:background .15s}
.seg button.on,.pill.on{background:linear-gradient(180deg,#ff6a14,#ff5300);color:#fff}
.pills{display:flex;gap:8px;margin-top:9px}
.pills .pill{padding:0 6px;font-size:14.5px}
/* categories */
.cats{display:flex;justify-content:space-between;gap:2px;margin:18px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 0 var(--gl);overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:76px;font-size:12px;font-weight:500;white-space:nowrap}
.cat img{width:70px;height:70px;border-radius:50%;display:block;object-fit:cover}
.banner{display:block;width:100%;margin-top:14px;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:643/320;background:var(--chip)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner button{position:absolute;left:5%;bottom:15%;width:43%;height:24%}
.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sect h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.sect button{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:2px}
.sect .ic{width:16px;height:16px}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative}
.pc .tile{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:18px 18px 0 0}
.pc .tile img{width:100%;height:100%;object-fit:contain;display:block}
.pc .info{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px}
.pc .t{font-size:16px;font-weight:700;letter-spacing:-.1px}
.pc .c{font-size:13px;color:var(--muted)}
.pc .m{font-size:13px}
.pc .pr{font-size:17px;font-weight:800;margin-top:2px}
.badge{position:absolute;left:10px;top:10px;height:22px;padding:0 10px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center}
.heart{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#16161a;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.heart .ic{width:17px;height:17px}
.heart.on{color:var(--accent)}
.mode .s{color:var(--muted)}
/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;padding:10px var(--gr) 10px var(--gl);background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--tabshadow)}
.tabs[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);padding:4px 0;position:relative}
.tab.on{color:var(--accent);font-weight:500}
.tab .ic{width:26px;height:26px}
.tab .dot{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.fab{position:absolute;left:50%;top:-28px;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;background:linear-gradient(160deg,#ff7a1f,#ff4d00);display:grid;place-items:center;box-shadow:0 0 0 7px var(--ring),0 10px 24px rgba(255,90,10,.45)}
.fab img{height:30px;display:block}
/* detail */
.hero{--hh:335px;position:relative;height:var(--hh);overflow:hidden}
.hero .slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero .slides::-webkit-scrollbar{display:none}
.hero .sl{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;padding-top:46px;padding-bottom:36px}
.hero .sl img{height:calc(var(--hh) - 84px);width:auto;max-width:none;display:block}
.hero .sl.plain img{height:calc(var(--hh) - 110px);width:auto;max-width:78%;object-fit:contain}
.round{position:absolute;width:39px;height:39px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#16161a;z-index:3}
.round.on{color:var(--accent)}
.cnt{position:absolute;right:16px;bottom:44px;background:rgba(40,40,44,.78);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px;z-index:3}
.dots{position:absolute;left:0;right:0;bottom:38px;display:flex;justify-content:center;gap:7px;z-index:3}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.75)}
.dots i.on{background:var(--accent)}
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:18px var(--gr) 120px var(--gl)}
.sheet h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.4px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;margin-top:8px}
.pricerow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.pricerow .pr{font-size:33px;font-weight:800;letter-spacing:-.5px}
.stat{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--fg);margin-left:6px}
.stat .ic{width:18px;height:18px}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14.5px;margin-top:6px}
.loc .ic{width:19px;height:19px}
.seller{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 14px 11px 12px;border:1px solid var(--line);border-radius:18px;width:100%;text-align:left}
.seller img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.seller b{font-size:17px}
.stars{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:15px}
.stars .st{color:var(--star);display:flex;align-items:center;gap:4px;font-weight:700}
.stars .st .ic{width:17px;height:17px}
.online{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:var(--greenbg);color:var(--green);font-size:13px;font-weight:500}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.specs div{background:var(--field);border-radius:12px;padding:8px 12px}
.specs small{display:block;color:var(--muted);font-size:12.5px}
.specs span{font-size:15px;font-weight:500}
.sheet h3{margin:16px 0 4px;font-size:18px;font-weight:800}
.sheet p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.cta{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;gap:10px;padding:14px var(--gr) 12px var(--gl);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{height:52px;border-radius:26px;font-size:16px;white-space:nowrap;font-weight:600;flex:1;display:grid;place-items:center;text-align:center}
.btn.main{background:linear-gradient(180deg,#ff640f,#ff5300);color:#fff;box-shadow:0 6px 18px rgba(255,90,10,.28)}
.btn.soft{background:var(--lav);color:var(--fg)}
.cta .soft{flex:1.05}
/* top bars on inner screens */
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:8px}
.bar h1{margin:0;font-size:19px;font-weight:800;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.bar>*{position:relative;z-index:1}
.circ{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.bar .link{color:var(--accent);font-weight:600;font-size:16px}
.big{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:6px}
.big h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.6px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.chat .top{display:flex;align-items:center;gap:10px;height:56px;flex:none}
.chat .top .who{flex:1;min-width:0}
.chat .top img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chat .top .av{position:relative}
.chat .top .av i{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:50%;background:#2fc45d;border:2px solid var(--bg)}
.chat .top b{font-size:17px;display:block}
.chat .top small{color:var(--muted);font-size:13px}
.prod{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:18px;flex:none;box-shadow:var(--shadow)}
.prod .th{width:62px;height:62px;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none}
.prod .th img{width:100%;height:100%;object-fit:contain}
.prod b{font-size:16.5px;display:block}
.prod small{display:block;color:var(--muted);font-size:13.5px}
.prod .pr{font-weight:800;font-size:17px}
.prod .m{margin-left:auto;font-size:13px;align-self:flex-end;padding-right:6px;padding-bottom:6px}
.msgs{flex:1;min-height:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px);mask-image:linear-gradient(to bottom,transparent 0,#000 18px);overflow-y:auto;padding:14px 0 10px;display:flex;flex-direction:column;gap:9px;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding-left:var(--gl);padding-right:var(--gr)}
.b{max-width:80%;padding:10px 13px 8px;border-radius:19px;font-size:15.5px;line-height:1.3;position:relative;word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--blue);border-bottom-right-radius:19px}
.b.them{align-self:flex-start;background:var(--bubble)}
.b .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:3px}
.b .tm .ic{width:18px;height:18px;color:#3b82f6;stroke-width:2}
.b.prop{width:84%;padding:13px 13px 8px}
.b.prop .h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16.5px;margin-bottom:8px}
.b.prop .in{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px}
.b.prop .in .th{width:56px;height:56px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.b.prop .in .th img{width:100%;height:100%;object-fit:contain}
.b.prop .in b{font-size:16px;display:block}
.b.prop .in small{color:var(--muted);font-size:13.5px;display:block}
.b.prop .in .pr{font-weight:800;font-size:16.5px}
.b.prop .ex{background:var(--card);border-radius:12px;padding:9px 12px;margin-top:6px;display:flex;align-items:center;gap:8px;font-size:15px}
.b.prop .ex .ic{color:var(--accent);width:20px;height:20px}
.b.prop .ex b{font-weight:800}
.voice{display:flex;align-items:center;gap:12px;min-width:240px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.wave{display:flex;align-items:center;gap:2.5px;height:36px;flex:1}
.wave i{width:3px;border-radius:2px;background:#9d9daa;display:block}
.wave i.p{background:var(--accent)}
.composer{display:flex;align-items:center;gap:10px;padding:8px 0 4px;flex:none}
.composer .circ{width:44px;height:44px;flex:none}
.composer input{flex:1;min-width:0;height:44px;border-radius:22px;border:0;outline:0;background:var(--chip);padding:0 16px;font-size:15.5px}
.composer .send{background:var(--accent);color:#fff}
/* sections / forms */
.sec{background:var(--section);border-radius:20px;padding:14px;margin-top:12px}
.sec>h3{margin:0 0 10px;font-size:19px;font-weight:800;letter-spacing:-.2px}
.sec>h3.sm{font-size:17px;font-weight:700;margin:0 0 8px}
.mini{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px}
.mini .th{width:64px;height:64px;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none}
.mini .th img{width:100%;height:100%;object-fit:contain}
.mini b{font-size:17px;display:block}
.mini .pr{font-weight:800;font-size:17px}
.mini .x{margin-left:auto;padding-left:14px;border-left:1px solid var(--line);color:var(--muted);height:44px;display:grid;place-items:center;width:52px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;background:var(--card);color:var(--accent);font-weight:600;font-size:17px;width:100%}
.radios{display:flex;gap:6px;background:var(--card);border-radius:16px;padding:10px 12px;justify-content:space-between}
.rad{display:flex;align-items:center;gap:8px;font-size:14.5px;white-space:nowrap}
.rad i{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;background:var(--card)}
.rad i .ic{width:18px;height:18px;opacity:0;stroke-width:2.6}
.rad.on i{background:var(--accent);border-color:var(--accent)}
.rad.on i .ic{opacity:1}
.amount{display:flex;align-items:center;justify-content:space-between;background:var(--field);border-radius:14px;height:48px;padding:0 16px;margin-top:8px;font-size:18px;font-weight:500}
.amount input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:18px;font-weight:500}
.ta{width:100%;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;min-height:70px;font-size:15.5px;resize:none;outline:0;color:var(--muted)}
.ta:focus{color:var(--fg);border-color:var(--accent)}
.fixedbtn{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:12px var(--gr) 12px var(--gl);background:linear-gradient(to top,var(--bg) 72%,transparent)}
.fixedbtn .btn{width:100%}
.steps{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
.steps button{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);white-space:nowrap;min-width:0}
.steps i{width:26px;height:26px;flex:none;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-style:normal;font-weight:600;color:var(--muted)}
.steps .on{color:var(--fg)}
.steps .on i,.steps .done i{background:var(--accent);color:#fff}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{position:relative;aspect-ratio:1/1.1;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .rm{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center}
.ph .rm .ic{width:16px;height:16px;stroke-width:2.6}
.ph.add{border:1.5px dashed var(--line);background:var(--section);color:var(--muted);text-align:center;font-size:15px;gap:4px;align-content:center}
.ph.add small{display:block;font-size:13.5px}
.lbl{font-size:19px;font-weight:800;margin:20px 0 10px;letter-spacing:-.2px}
.field{display:flex;align-items:center;justify-content:space-between;height:48px;border-radius:16px;background:var(--field);padding:0 16px;font-size:16.5px;border:0;width:100%;text-align:left}
.field input{flex:1;background:none;border:0;outline:0;font-size:16.5px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 20px;border-radius:20px;background:var(--chip);font-size:15.5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.chip.on{background:linear-gradient(180deg,#ff6a14,#ff5300);color:#fff}
.chip.line{background:var(--card);border:1px solid var(--line)}
.chip.line.on{border-color:transparent;background:linear-gradient(180deg,#ff6a14,#ff5300);color:#fff}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .chip{justify-content:center;padding:0}
.modes{display:flex;gap:4px;background:var(--chip);border-radius:24px;padding:0}
.modes button{flex:1;height:46px;border-radius:23px;font-size:14.5px;font-weight:500;padding:0 4px;line-height:1.1}
.modes button.on{background:linear-gradient(180deg,#ff6a14,#ff5300);color:#fff}
/* range */
.range{background:var(--section);border-radius:18px;padding:12px}
.range .vals{display:flex;align-items:center;gap:12px}
.range .vals input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--card);text-align:left;padding:0 16px;font-size:16.5px;outline:0}
.range .vals input:last-child{text-align:right}
.rs{position:relative;height:34px;margin:12px 6px 0}
.rs .tr{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:var(--line)}
.rs .fl{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--accent)}
.rs input[type=range]{position:absolute;left:-6px;width:calc(100% + 12px);top:0;height:34px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rs input[type=range]::-webkit-slider-runnable-track{background:none;height:34px}
.rs input[type=range]::-moz-range-track{background:none;height:34px}
.rs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);margin-top:4px}
.rs input[type=range]::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* profile & lists */
.prof{display:flex;align-items:center;gap:16px;margin-top:8px}
.prof .av{position:relative;width:108px;height:108px;flex:none}
.prof .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.prof .av i{position:absolute;right:4px;bottom:6px;width:24px;height:24px;border-radius:50%;background:#2fc45d;border:4px solid var(--bg)}
.prof h2{margin:0 0 6px;font-size:26px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 4px}
.stats div{text-align:center;padding:0 6px;border-left:1px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:25px;font-weight:800}
.stats span{font-size:13.5px;color:var(--muted);display:block;line-height:1.2;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mrow{display:flex;align-items:center;gap:16px;height:60px;padding:0 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:17px;font-weight:500;text-align:left;width:100%}
.mrow .ic:first-child{width:26px;height:26px}
.mrow .grow{flex:1}
.mrow .num{min-width:25px;height:25px;border-radius:13px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.mrow .ic.chev{width:20px;height:20px;color:var(--muted)}
.nrow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.nrow .lead{position:relative;width:62px;height:62px;flex:none}
.nrow .lead>img,.nrow .lead>.th{width:100%;height:100%;border-radius:50%;object-fit:cover}
.nrow .lead>.th{border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--chip)}
.nrow .lead>.th img{width:100%;height:100%;object-fit:contain}
.nrow .bd{position:absolute;right:-6px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.nrow .bd.g{background:#2fc45d}
.nrow .bd .ic{width:15px;height:15px;stroke-width:2.3}
.nrow .tx{flex:1;min-width:0}
.nrow .tx .r1{display:flex;justify-content:space-between;gap:8px}
.nrow b{font-size:16.5px;font-weight:800}
.nrow time{font-size:13.5px;color:var(--muted);white-space:nowrap}
.nrow p{margin:3px 0 0;color:var(--muted);font-size:14.5px;line-height:1.3}
.nrow>.ic{width:20px;height:20px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:56px 24px;font-size:15.5px;line-height:1.45}
.empty .ic{width:46px;height:46px;color:var(--accent);margin-bottom:10px}
.pillst{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:11px;font-size:12.5px;font-weight:500;background:var(--greenbg);color:var(--green)}
.pillst.p{background:#fff1dc;color:#c26a00}
.pillst.d{background:var(--chip);color:var(--muted)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,12px);background:rgba(24,24,28,.94);color:#fff;font-size:14.5px;padding:11px 18px;border-radius:22px;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.noscroll{overflow:hidden}
@media (orientation:landscape) and (max-height:520px){
  .app{max-width:560px}
  .hero{--hh:250px}
  .tabs{padding-top:6px;padding-bottom:4px}
  .tab{gap:2px;padding:2px 0}
  .fab{top:-20px;width:56px;height:56px}
  .fab img{height:26px}
  .sc{padding-bottom:96px}
}
</style>

  <div class="chips">${['Apple', 'Samsung', 'Xiaomi', 'Google', 'Nothing'].map(o => `<button class="chip ${f.brand === o ? 'on' : ''}" data-act="fset" data-k="brand" data-id="${o}">${o === 'Apple' ? ic('apple', 'fill') : ''}${o}</button>`).join('')}</div>
  <div class="lbl">Память</div><div class="chips">${['128 ГБ', '256 ГБ', '512 ГБ', '1 ТБ'].map(o => `<button class="chip ${f.mem === o ? 'on' : ''}" data-act="fset" data-k="mem" data-id="${o}">${o}</button>`).join('')}</div>
  <div class="lbl">Дополнительно</div><div class="chips">${['Только обмен', 'Только продажа', 'С доставкой'].map(o => `<button class="chip ${f.extra === o ? 'on' : ''}" data-act="fset" data-k="extra" data-id="${o}">${o}</button>`).join('')}</div>
  <!--FIX--><div class="fixedbtn"><button class="btn main" data-act="fapply" id="fcount">Показать ${fmt(count)} объявлений</button></div>`;
};
V.profile = () => `<div class="big"><h1>Профиль</h1><button data-act="settings" aria-label="Настройки" style="padding:6px">${ic('hex')}</button></div>
  <div class="prof"><span class="av"><img src="${A.ava_max}" alt=""><i></i></span><div><h2>Максим</h2><span class="online">Онлайн</span><div class="stars" style="margin-top:8px"><span class="st">${ic('star', 'fill')}5.0</span><span class="muted">(42 отзыва)</span></div></div></div>
  <div class="stats"><div><b>24</b><span>Активные объявления</span></div><div><b>131</b><span>Завершенные обмены</span></div><div><b>${Object.values(P).filter(p => p.liked).length + 16}</b><span>В избранном</span></div></div>
  <div class="menu">
    <button class="mrow" data-act="my">${ic('doc')}<span class="grow">Мои объявления</span>${ic('right', 'chev')}</button>
    <button class="mrow" data-act="offers">${ic('swap')}<span class="grow">Предложения обмена</span><span class="num">3</span>${ic('right', 'chev')}</button>
    <button class="mrow" data-act="tab" data-id="fav">${ic('heart')}<span class="grow">Избранное</span>${ic('right', 'chev')}</button>
    <button class="mrow" data-act="history">${ic('history')}<span class="grow">История обменов</span>${ic('right', 'chev')}</button>
    <button class="mrow" data-act="settings">${ic('gear')}<span class="grow">Настройки</span>${ic('right', 'chev')}</button>
  </div>`;
const NOTIFS = [
  { k: 'Обмены', lead: 'ava_max', bd: 'swap', t: 'Новое предложение обмена', time: '10:24', p: 'Максим предложил обмен на ваш iPhone 15 Pro.', to: 'chat' },
  { k: 'Сообщения', lead: 'ava_anna', bd: 'chat', t: 'Новое сообщение', time: '10:18', p: '<b style="font-weight:600;color:var(--fg)">Анна:</b> Здравствуйте! Интересует ваш MacBook Air. Давайте обсудим детали?', to: 'chat' },
  { k: 'Система', thumb: 'mac', bd: 'mega', t: 'Объявление продвинуто', time: '09:42', p: 'Ваше объявление «MacBook Air M2» теперь отображается выше в поиске.', to: 'mac' },
  { k: 'Обмены', thumb: 'i15pro', bd: 'check', g: 1, t: 'Сделка завершена', time: 'Вчера', p: 'Обмен по объявлению «iPhone 15 Pro» успешно завершен. Спасибо, что используете Бартер!', to: 'i15pro' },
  { k: 'Система', lead: 'ava_alex', bd: 'uadd', t: 'Новый подписчик', time: 'Вчера', p: 'Алексей теперь подписан на вас. Смотрите его объявления!', to: 'profile' }
];
V.notif = () => {
  const l = NOTIFS.map((n, i) => ({ ...n, i })).filter(n => S.notifFilter === 'Все' || n.k === S.notifFilter);
  return `<div class="big"><h1>Уведомления</h1><button class="sq" data-act="settings" aria-label="Настройки">${ic('gear')}</button></div>
  <div class="pills" style="margin-top:6px">${['Все', 'Обмены', 'Сообщения', 'Система'].map(m => `<button class="pill ${S.notifFilter === m ? 'on' : ''}" data-act="nf" data-id="${m}">${m}</button>`).join('')}</div>
  <div class="list">${l.map(n => `<button class="nrow" data-act="nopen" data-id="${n.i}"><span class="lead">${n.lead ? `<img src="${A[n.lead]}" alt="">` : `<span class="th" style="background:${A.prod[P[n.thumb].img].bg}"><img src="${A.prod[P[n.thumb].img].src}" alt=""></span>`}<span class="bd ${n.g ? 'g' : ''}">${ic(n.bd)}</span></span><span class="tx"><span class="r1"><b>${n.t}</b><time>${n.time}</time></span><p>${n.p}</p></span>${ic('right')}</button>`).join('')}</div>
  ${l.length ? '' : '<div class="empty">Здесь пока нет уведомлений.</div>'}`;
};
V.my = () => {
  const st = [['Активно', ''], ['Активно', ''], ['На паузе', 'p'], ['Завершено', 'd']];
  const ids = ['i15pro', 'mac', 'airpods', 'i14'];
  return `<div class="bar"><button class="circ" data-act="back" aria-label="Назад">${ic('left')}</button><h1>Мои объявления</h1><span style="width:42px"></span></div>
  <div class="list">${ids.map((id, i) => `<button class="nrow" data-act="open" data-id="${id}"><span class="lead"><span class="th" style="background:${A.prod[P[id].img].bg}"><img src="${A.prod[P[id].img].src}" alt=""></span></span><span class="tx"><span class="r1"><b>${P[id].t}</b><span class="pillst ${st[i][1]}">${st[i][0]}</span></span><p>${fmt(P[id].price)}&nbsp;₽ · ${P[id].mode}<br>${P[id].views} просмотров · ${P[id].likes} в избранном</p></span></button>`).join('')}</div>`;
};
V.history = () => `<div class="bar"><button class="circ" data-act="back" aria-label="Назад">${ic('left')}</button><h1>История обменов</h1><span style="width:42px"></span></div>
  <div class="list">${[['i15pro', 'Обмен на MacBook Air M2', 'Вчера'], ['s24', 'Покупка', '12 окт'], ['airpods', 'Обмен на Apple Watch', '3 окт']].map(([id, t, d]) => `<div class="nrow"><span class="lead"><span class="th" style="background:${A.prod[P[id].img].bg}"><img src="${A.prod[P[id].img].src}" alt=""></span><span class="bd g">${ic('check')}</span></span><span class="tx"><span class="r1"><b>${P[id].t}</b><time>${d}</time></span><p>${t}</p></span></div>`).join('')}</div>`;
V.settings = () => {
  const row = (t, k) => `<button class="mrow" data-act="sw" data-id="${k}"><span class="grow">${t}</span><span class="sw ${S.sw[k] ? 'on' : ''}"></span></button>`;
  return `<div class="bar"><button class="circ" data-act="back" aria-label="Назад">${ic('left')}</button><h1>Настройки</h1><span style="width:42px"></span></div>
  <div class="lbl" style="margin-top:6px">Тема</div><div class="modes">${[['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, n]) => `<button class="${S.theme === k ? 'on' : ''}" data-act="theme" data-id="${k}">${n}</button>`).join('')}</div>
  <div class="menu" style="margin-top:22px">${row('Push-уведомления', 'push')}${row('Показывать, что я онлайн', 'online')}${row('Предлагать доставку', 'deliv')}</div>`;
};

/* ---------- render ---------- */
function render(reset) {
  const c = cur(), v = $('#view');
  const noTab = NOTAB.includes(c.n);
  S.tab = TABOF[c.n] || S.tab;
  const full = c.n === 'chat';
  const [main, fix = ''] = V[c.n]().split('<!--FIX-->');
  v.innerHTML = `<div class="screen"><div class="sc ${full ? 'noscroll' : ''}" id="scr">${main}</div>${fix}</div>`;
  const t = $('#tabs'); t.hidden = noTab; t.innerHTML = tabsHtml();
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  const sl = $('#slides'); if (sl) sl.addEventListener('scroll', () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); if (i !== S.slide) { S.slide = i; $('#cnt').textContent = (i + 1) + '/5'; document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i)); } });
  bindInputs();
}
function rerender(keep) { const sc = $('#scr'); const y = sc ? sc.scrollTop : 0; render(); const n = $('#scr'); if (n && keep) n.scrollTop = y; }
function bindInputs() {
  const q = $('#q'); if (q) q.addEventListener('input', e => { S.q = e.target.value; const pos = e.target.selectionStart; rerender(true); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  if (q) q.addEventListener('keydown', e => { if (e.key === 'Enter' && cur().n === 'home' && S.q) { go('cat'); } });
  const a = $('#amount'); if (a) a.addEventListener('input', e => { S.offer.amount = parseInt(e.target.value.replace(/\D/g, '')) || 0; e.target.value = fmt(S.offer.amount); });
  const om = $('#omsg'); if (om) om.addEventListener('input', e => S.offer.msg = e.target.value);
  const pt = $('#ptitle'); if (pt) pt.addEventListener('input', e => S.post.title = e.target.value);
  const pp = $('#pprice'); if (pp) pp.addEventListener('input', e => { S.post.price = parseInt(e.target.value.replace(/\D/g, '')) || 0; e.target.value = fmt(S.post.price); });
  const mi = $('#msg'); if (mi) { mi.addEventListener('input', () => { const b = $('#sendbtn'); const has = mi.value.trim(); b.classList.toggle('send', !!has); b.innerHTML = ic(has ? 'send' : 'mic', has ? 'fill' : ''); b.setAttribute('aria-label', has ? 'Отправить' : 'Голосовое'); }); mi.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); }); }
  const rmin = $('#rmin'), rmax = $('#rmax');
  if (rmin) {
    const upd = (who) => {
      let lo = +rmin.value, hi = +rmax.value;
      if (lo > hi) { if (who === 'min') { lo = hi; rmin.value = lo; } else { hi = lo; rmax.value = hi; } }
      S.flt.min = lo * 2000; S.flt.max = hi * 2000;
      $('#fl').style.left = lo + '%'; $('#fl').style.right = (100 - hi) + '%';
      $('#pmin').value = fmt(S.flt.min); $('#pmax').value = fmt(S.flt.max); fcount();
    };
    rmin.addEventListener('input', () => upd('min')); rmax.addEventListener('input', () => upd('max'));
    const setP = (id, key, other) => $(id).addEventListener('change', e => { let v = parseInt(e.target.value.replace(/\D/g, '')) || 0; v = Math.max(0, Math.min(200000, v)); S.flt[key] = v; if (S.flt.min > S.flt.max) { if (key === 'min') S.flt.max = v; else S.flt.min = v; } rerender(); });
    setP('#pmin', 'min'); setP('#pmax', 'max');
  }
}
function fcount() {
  const f = S.flt;
  const count = Math.max(0, 1284 - (f.min > 0 ? Math.round(f.min / 400) : 0) - Math.round((200000 - f.max) / 300) - (f.cond !== 'Любое' ? 220 : 0) - (f.extra === 'С доставкой' ? 410 : f.extra ? 190 : 0));
  const b = $('#fcount'); if (b) b.textContent = 'Показать ' + fmt(count) + ' объявлений';
}
function sendMsg() {
  const i = $('#msg'); if (!i) return; const v = i.value.trim(); if (!v) { toast('Удерживайте микрофон, чтобы записать'); return; }
  S.msgs.push({ me: 1, text: v, t: nowT() }); rerender(); $('#msg').focus();
}

/* ---------- actions ---------- */
const act = {
  tab: id => tab(id), back, scan: () => toast('Сканер штрих-кодов скоро появится'), soon: () => toast('Выбор категории скоро появится'),
  filters: () => go('filters'), post: () => { S.post.step = 0; go('post'); },
  hmode: id => { S.homeMode = id; rerender(true); },
  cmode: id => { S.catMode = id; rerender(true); },
  brand: id => { if (S.brandOn && S.brand === id) { S.brandOn = false; } else { S.brand = id; S.brandOn = true; } rerender(true); },
  cat: id => { if (id === 'Техника') { S.q = ''; go('cat'); } else toast(`Раздел «${id}» скоро появится`); },
  offers: () => { S.notifFilter = 'Обмены'; tab('notif'); },
  open: (id) => { S.detail = id; S.slide = 0; go('detail'); },
  like: (id, el, e) => { P[id].liked = !P[id].liked; rerender(true); },
  share: () => { try { navigator.clipboard.writeText(location.href).then(() => toast('Ссылка скопирована'), () => toast('Ссылка готова к отправке')); } catch (e) { toast('Ссылка готова к отправке'); } },
  seller: () => tab('profile'),
  buy: () => toast('Покупка оформляется через чат с продавцом'),
  offer: () => { S.offer.mine = ['mac', 'airpods']; go('offer'); },
  rmoffer: id => { S.offer.mine = S.offer.mine.filter(x => x !== id); rerender(true); },
  addoffer: () => { const pool = ['s24', 'xiaomi', 'i14', 'nothing'].filter(x => !S.offer.mine.includes(x)); if (!pool.length) return toast('Больше нет товаров для обмена'); S.offer.mine.push(pool[0]); rerender(true); },
  dir: id => { S.offer.dir = id; rerender(true); },
  sendoffer: () => {
    const o = S.offer; if (!o.mine.length) return toast('Добавьте хотя бы один товар');
    const first = o.mine[0];
    S.msgs.push({ me: 1, prop: { id: first, price: first === 'mac' ? 70000 : P[first].price, extra: o.dir === 'them' ? o.amount : 0 }, t: nowT() });
    if (o.msg.trim()) S.msgs.push({ me: 1, text: o.msg.trim(), t: nowT() });
    S.stack.pop(); go('chat'); toast('Предложение отправлено');
  },
  send: () => sendMsg(),
  voice: () => { S.voice = !S.voice; rerender(); },
  call: () => toast('Звонок доступен в приложении'), menu: () => toast('Меню чата скоро появится'), attach: () => toast('Вложения скоро появятся'),
  pstep: id => { S.post.step = +id; rerender(); }, pmode: id => { S.post.mode = id; rerender(true); },
  pset: (id, el) => { S.post[el.dataset.k] = id; rerender(true); },
  pnext: () => { if (S.post.step < 2) { S.post.step++; rerender(); $('#scr').scrollTop = 0; } else { S.stack = [{ n: 'home' }]; S.tab = 'home'; render(); toast('Объявление опубликовано'); } },
  addphoto: () => toast('Загрузка фото доступна в приложении'), rmphoto: () => toast('Нужна хотя бы одна фотография'),
  fset: (id, el) => { const k = el.dataset.k; S.flt[k] = (S.flt[k] === id && k !== 'cond') ? '' : id; rerender(true); },
  freset: () => { S.flt = { min: 0, max: 200000, cond: 'Любое', brand: '', mem: '', extra: '' }; rerender(true); },
  fapply: () => { S.stack.pop(); if (cur().n === 'home') { S.q = ''; go('cat'); } else render(); },
  settings: () => go('settings'), my: () => go('my'), history: () => go('history'),
  sw: id => { S.sw[id] = !S.sw[id]; rerender(true); },
  theme: id => { S.theme = id; if (id === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = id; try { localStorage.setItem('barter-theme', id); } catch (e) {} rerender(true); },
  nf: id => { S.notifFilter = id; rerender(true); },
  nopen: id => { const n = NOTIFS[+id]; if (n.to === 'chat') go('chat'); else if (n.to === 'profile') tab('profile'); else { S.detail = n.to; S.slide = 0; go('detail'); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = act[el.dataset.act]; if (!f) return;
  e.stopPropagation();
  const heart = el.dataset.act === 'like';
  if (heart) e.preventDefault();
  f(el.dataset.id, el, e);
}, true);
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pc[data-act]')) { e.preventDefault(); act.open(e.target.dataset.id); } });
new MutationObserver(() => rerender(true)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => rerender(true));
try { const th = localStorage.getItem('barter-theme'); if (th && th !== 'auto') { S.theme = th; document.documentElement.dataset.theme = th; } } catch (e) {}
render();
</script>

</body>
</html>
