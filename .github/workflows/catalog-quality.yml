name: Catalog v5 quality
on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/api/src/categories/**'
      - 'apps/api/src/listings/listings.service.ts'
      - '.github/workflows/catalog-quality.yml'
  push:
    branches: [master]
    paths:
      - 'apps/api/src/categories/**'
      - 'apps/api/src/listings/listings.service.ts'
      - '.github/workflows/catalog-quality.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/check-security-lockfile.cjs
      - name: Generate Prisma Client
        run: npm run prebuild -w @app/api
      - name: Full API regression suite
        run: npm test -w @app/api -- --runInBand
      - name: Production API build
        run: npm run build -w @app/api
