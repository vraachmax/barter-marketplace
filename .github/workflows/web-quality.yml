name: Web quality

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Web regression tests
        run: npm run test -w @app/web
      - name: Production build and TypeScript
        run: npm run build -w @app/web -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated browser test tools
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/barter-browser-tools" --no-package-lock --ignore-scripts @playwright/test@1.58.2
          "$RUNNER_TEMP/barter-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Account browser acceptance
        run: node apps/web/tests/browser/account-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Listings, pricing and catalog browser acceptance
        run: node apps/web/tests/browser/listings-layout-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Messages browser acceptance
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: node apps/web/tests/browser/messages-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Upload messages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messages-browser-evidence
          path: apps/web/test-results/messages/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload listings layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-layout-evidence
          path: apps/web/test-results/listings-layout/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload account acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-evidence
          path: apps/web/test-results/account/
          retention-days: 14
          if-no-files-found: ignore
