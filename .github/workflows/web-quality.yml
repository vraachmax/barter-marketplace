name: Web quality

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-quality.yml'

permissions:
  contents: read

jobs:
  regenerate-security-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/remediate-deps-2026-11-08'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve fresh lockfile from declared dependency constraints
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Diagnose version constraints
        run: |
          npm explain zod || true
          npm explain multer || true
          npm view @nestjs/platform-express version
          npm view @huggingface/inference version
      - name: Lockfile security gate
        run: node scripts/check-security-lockfile.cjs
      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: node apps/api/node_modules/prisma/build/index.js generate --schema apps/api/prisma/schema.prisma
      - name: API unit tests
        run: npm run test -w @app/api -- --runInBand
      - name: Web unit tests
        run: npm run test -w @app/web
      - name: API build
        run: npm run build -w @app/api
      - name: Web build
        run: npm run build -w @app/web -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Commit validated lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then echo 'No lockfile delta'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: commit resolved and tested npm lockfile'
          git push origin HEAD:security/remediate-deps-2026-11-08
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Browser acceptance syntax
        run: node --check apps/web/tests/browser/exchange-acceptance.mjs
      - name: Web regression tests
        run: npm run test -w @app/web
      - name: Production build and TypeScript
        run: npm run build -w @app/web -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated browser test tools
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/barter-browser-tools" --no-package-lock --ignore-scripts @playwright/test@1.58.2
          "$RUNNER_TEMP/barter-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Account browser acceptance
        run: node apps/web/tests/browser/account-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Listings, pricing and catalog browser acceptance
        run: node apps/web/tests/browser/listings-layout-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Messages browser acceptance
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: node apps/web/tests/browser/messages-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: Exchange and contact browser acceptance
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: node apps/web/tests/browser/exchange-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
      - name: iPhone-sized WebKit voice acceptance
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: node apps/web/tests/browser/exchange-acceptance.mjs
        env:
          BARTER_BROWSER_TOOLS: ${{ runner.temp }}/barter-browser-tools
          BARTER_BROWSER_ENGINE: webkit
      - name: Upload exchange evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-browser-evidence
          path: apps/web/test-results/exchange/
          retention-days: 14
      - name: Upload messages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messages-browser-evidence
          path: apps/web/test-results/messages/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload listings layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-layout-evidence
          path: apps/web/test-results/listings-layout/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload account acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-evidence
          path: apps/web/test-results/account/
          retention-days: 14
          if-no-files-found: ignore
