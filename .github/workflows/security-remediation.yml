name: Security remediation lockfile and compatibility

on:
  push:
    branches:
      - security/remediate-deps-2026-11-08
    paths:
      - 'package.json'
      - 'apps/web/package.json'
      - 'apps/api/package.json'
      - '.github/workflows/security-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependency tree, no force, no audit fix
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh compatible transitive security fixes without major forcing
        run: npm update body-parser qs undici zod fast-uri follow-redirects --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency lock consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce patched package versions in the resolved lockfile
        run: node scripts/check-security-lockfile.cjs
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: API build
        run: npm run build -w @app/api
      - name: API tests
        run: npm run test -w @app/api -- --runInBand
      - name: Web tests
        run: npm run test -w @app/web
      - name: Web production build
        run: npm run build -w @app/web -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Save npm audit for follow-up analysis
        if: always()
        run: npm audit --json > npm-audit-remediation.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-npm-audit
          path: npm-audit-remediation.json
          retention-days: 7
      - name: Commit only tested lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: regenerate npm lockfile using patched dependency resolutions'
          git push origin HEAD:security/remediate-deps-2026-11-08
